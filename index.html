<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R32 Engine Manual &mdash; Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128295;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e7e9e4; --surface:#f5f6f2; --surface-2:#eceee8;
  --ink:#181a1c; --ink-2:#565b5d; --ink-3:#828886;
  --line:#cdd0c9; --line-2:#dbded6;
  --accent:#c1322a; --accent-2:#a82922;
  --hit:#ffd23f; --hit-ink:#241d00;
  --ring:rgba(193,50,42,.20);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161a; --surface:#1c1f23; --surface-2:#23272c;
    --ink:#e8eae7; --ink-2:#a7ada9; --ink-3:#79807c;
    --line:#31363b; --line-2:#3a4046;
    --accent:#e5564b; --accent-2:#f0695e;
    --hit:#f0c24a; --hit-ink:#211a09;
    --ring:rgba(229,86,75,.26);
  }
}
:root[data-theme="dark"]{
  --paper:#14161a; --surface:#1c1f23; --surface-2:#23272c;
  --ink:#e8eae7; --ink-2:#a7ada9; --ink-3:#79807c;
  --line:#31363b; --line-2:#3a4046;
  --accent:#e5564b; --accent-2:#f0695e;
  --hit:#f0c24a; --hit-ink:#211a09;
  --ring:rgba(229,86,75,.26);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1060px; margin:0 auto; min-height:100vh; background:var(--paper)}

/* header plate */
.plate{display:flex; align-items:baseline; gap:14px; padding:20px 22px 15px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.plate .code{font-family:var(--mono); font-weight:600; font-size:13px; letter-spacing:1.5px; color:#fff; background:var(--accent); padding:5px 10px; border-radius:5px; align-self:center}
.plate .title{font-size:15px; font-weight:600}
.plate .title .sub{color:var(--ink-2); font-weight:400}
.plate .stat{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-2); align-self:center}
.plate .stat b{color:var(--ink); font-weight:600}

/* console */
.console{position:sticky; top:0; z-index:30; background:var(--paper); border-bottom:1px solid var(--line); padding:12px 22px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.field{position:relative; flex:1 1 320px; display:flex; align-items:center; gap:9px; background:var(--surface); border:1.5px solid var(--line); border-radius:9px; height:48px; padding:0 12px}
.field svg{flex:none; width:18px; height:18px; stroke:var(--ink-3)}
.field input{border:0; background:transparent; outline:0; flex:1; font:inherit; font-size:16px; color:var(--ink); min-width:0}
.field input::placeholder{color:var(--ink-3)}
.field:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
.clear{border:0; background:transparent; color:var(--ink-3); font-size:20px; line-height:1; cursor:pointer; padding:4px; display:none}
.clear:hover{color:var(--ink)}
.field.has-val .clear{display:block}

select{font:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:8px; height:48px; padding:0 10px; cursor:pointer; max-width:min(46vw,320px)}
select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

.seg{display:flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; height:48px}
.seg button{font:inherit; font-size:13px; color:var(--ink-2); background:var(--surface); border:0; padding:0 13px; cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}

/* readout */
.readout{display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:11px 22px; border-bottom:1px solid var(--line-2); font-size:13px; color:var(--ink-2); min-height:44px}
.readout .count{font-family:var(--mono); color:var(--ink)}
.readout .count b{color:var(--accent-2)}
.sortwrap{margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px}
.sortwrap select{height:32px; font-size:12.5px; border-radius:6px}

/* results */
.results{padding:2px 0 72px}
.row{display:grid; grid-template-columns:88px minmax(0,1fr); gap:20px; padding:18px 22px; border-bottom:1px solid var(--line-2)}
.marker{border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:7px; background:var(--surface); padding:9px 6px 8px; text-align:center; height:max-content}
.marker .pno{font-family:var(--mono); font-weight:600; font-size:20px; letter-spacing:.5px; color:var(--ink)}
.marker .plab{font-family:var(--mono); font-size:9px; color:var(--ink-3)}
.marker .hits{margin-top:7px; padding-top:6px; border-top:1px solid var(--line); font-family:var(--mono); font-size:10px; color:var(--accent-2)}
.body{min-width:0}
.sect{font-family:var(--mono); font-size:11px; letter-spacing:.3px; color:var(--ink-3); margin-bottom:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snip{font-size:14.5px; line-height:1.62; color:var(--ink); max-width:74ch}
.snip p{margin:0 0 5px}
.snip p:last-child{margin-bottom:0}
mark{background:var(--hit); color:var(--hit-ink); padding:0 2px; border-radius:2px; font-weight:600}
.viewbtn{margin-top:10px; font:inherit; font-size:12.5px; color:var(--accent-2); background:transparent; border:0; padding:4px 0; cursor:pointer; font-weight:500}
.viewbtn:hover{text-decoration:underline}
.full{margin-top:11px; padding:15px 16px; background:var(--surface); border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--ink-2); max-height:440px; overflow:auto}

/* empty / no-results */
.empty{padding:66px 24px 60px; text-align:center; color:var(--ink-2)}
.empty h2{margin:0 0 8px; font-size:21px; font-weight:600; color:var(--ink)}
.empty p{margin:0 auto; max-width:44ch; font-size:14.5px}
.chips{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:22px}
.chip{font:inherit; font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:8px 14px; cursor:pointer}
.chip .m{font-family:var(--mono); color:var(--ink-3); font-size:11px; margin-left:4px}
.chip:hover{border-color:var(--accent); color:var(--accent-2)}
.tip{margin-top:30px; font-size:12.5px; color:var(--ink-3)}
.tip kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:1px 6px}

@media (prefers-reduced-motion: no-preference){
  .field,.chip,.seg button{transition:border-color .12s, box-shadow .12s, color .12s, background .12s}
}
@media (max-width:640px){
  .plate{padding:16px 15px 12px}
  .console{padding:10px 15px}
  .readout{padding:10px 15px}
  .row{grid-template-columns:58px minmax(0,1fr); gap:13px; padding:16px 15px}
  .marker .pno{font-size:16px}
  .field{flex-basis:100%; order:-1}
  .snip{font-size:14px}
}
</style>
</head>

</div>

Operate hoist chain and change engine angle gradually. ‘ \\\n\nCare must be taken not to interfere with vehicle and aN a os\n\nremove the engine. BAY [-\nHl Sate i\n\nEN - 185"},{"p":204,"t":"ENGINE OVERHAUL\n\nRB26DETT ENGINE\n12 ENGINE OVERHAUL\nThis section describes the component disassembly of the engine assembly removed from\nthe vehicle without transmission. It also explains the inspection, replacement of\nmalfunctioning, damages or warn parts and carry out any necessary adjustments and\nsequential assembly in order to produce a standard engine condition.\nOVERHAUL CAUTIONS\n(1) Disassembly\n\n+ Use correct and suitable tools when possible and make sure to carry out safe\nprocedures.\n\n* Care must be taken with operations on mating surfaces and sliding surfaces to\nprevent loss of surface accuracy.\n\n+ Arrange disassembled pars by making marks to organize for easy faults detection\nand precise assembly.\n\n+ Loosen nuts and bolts in a diagonal direction from outside. Care must be taken to\nfollow the numerical order when indicated.\n\n(2) Inspection, repair and replacement\n\n* Replace or repair after completing parts inspection following the inspection\nprocedures. Perform same inspection for the new parts and replace parts as\nnecessary.\n\n(3) Assembly\n\n* Always use a torque wrench to tighten nuts and bolts to specific tightening torque.\n\n+ Tighten nuts and bolts from centre to outside diagonal direction, gradually in two or\nthree successive stages. Follow the numeric order when indicated.\n\n+ Replace gasket, packing, oil seals and O-rings with new ones in principle.\n\n* Clean each part thoroughly and blown off with compressed air. In particular, check\nthat oil and water passages are not clogged or obstructed.\n\n* Care must be taken not to scratch or damage sliding or mating surfaces. Clean off all\ndust, debris or foreign objects. Lubricate all sliding surface with an adequate\ncoating oil.\n\nEN - 186"},{"p":205,"t":"ENGINE OVERHAUL\nRB26DETT e\nprocedures.\n\n* Care must be taken with operations on mating surfaces and sliding surfaces to\nprevent loss of surface accuracy.\n\n+ Arrange disassembled pars by making marks to organize for easy faults detection\nand precise assembly.\n\n+ Loosen nuts and baits in a diagonal direction from outside. Care must be taken to\nfollow the numerical order when indicated.\n\n(2) Inspection, repair and replacement\n\n+ Replace or repair after completing parts inspection following the inspection\nprocedures. Perform same inspection for the new parts and replace parts as\nnecessary.\n\n(3) Assembly\n\n- Always use a torque wrench to tighten nuts and bolts to specific tightening torque.\n\n+ Tighten nuts and bolts from centre to outside diagonal direction, gradually in two or\nthree successive stages. Follow the numeric order when indicated.\n\n+ Replace gasket, packing, oil seals and O-rings with new ones in principle.\n\n* Clean each part thoroughly and blown off with compressed air. In particular, check\nthat oil and water passages are not clogged or obstructed.\n\n* Care must be taken not to scratch or damage sliding or mating surfaces. Clean off all\ndust, debris or foreign objects. Lubricate all sliding surface with an adequate\ncoating oil.\n\nEN - 202"},{"p":221,"t":"ENGINE OVERHAUL\nRBZSDE ENGINE\n12-1 CYLINDER BLOCK DISASSEMBLE, ASSEMBLE & INSPECTION\nDetonation sensor 2.5 ~ 3.5{0} .\nSA Rear oil seal retainer J\n\\ ~ ema <— Rear oi! seal\nWater pump bolt 3.2~4.3 —. ~ 2S or\n\\ Alternator adjustment, SS SSO ‘| We 0}\nPe PES C= Gon al _ ~~ Retainer bolt 0.64 ~0.85\n& I Sl Be BE Ot Nes\nGye EO Betas Lp | teed HP\\ / Flywheel bolt\nBRS SE Ne ee Cylinder block irq 5 ~ 15.5\n. BAN het . .\nOli pump bolt Bn id SS MEE S alae AIT 9.5~ 10.5\n1.0~ 120} Nor) eee R Oilpump eee”, O-ring Reinforce plate (AT) 1]\nBs) hea eq gasket 7 Main bearing | a | |\nhe = ©] oil strainer- Va A Pilot bush (M/T) j |\nFront oil seal ! Oil strainer bolt 1.6 ~ 2.4 “~ as / Lfpnew;, Lab\nOil pum C  thoroughly and blown off with compressed air. In particular, check\nthat oil and water passages are not clogged or obstructed.\n\n* Care must be taken not to scratch or damage sliding or mating surfaces. Clean off all\ndust, debris or foreign objects. Lubricate all sliding surface with an adequate\ncoating oil.\n\nEN - 217"},{"p":236,"t":"ENGINE OVERHAUL\nRB20E / DE / DET ENGINE\n12-1 DISASSEMBLE & ASSEMBLE CYLINDER BLOCK ASSY\n[oy Detonation sensor bolt Detonation sensor\n(2)25~35 ox. 2.5 ~ 3.5 (RB20E) PF RaRear oil seal retainer [Point 6]\n\\ ~ _— . = _ Rear oil seal ‘on\ne. Ce Se be: °\nWater pump bolt a + ea See a: A\nAlternator adj bar. 775s: = ee en ~~ <3 S Retainer bolt {0}\nb= SP. Home Woks Seg hee 0.7 ~0.8\nSE ea tee eee\n| eye RE ex Sela PS ea et Cylinder block [Point 28, 29]\nOil it 1.0~1. Ta ARR\nipump bok fe oN Gee wy we PF ot 3.1 ~ 4.1 Flywheel bolt\n\\o st S a oa a O-ring S~ (RBZODET|O} wrias~ 165 09\net ; , o x : . 9.5 ~ 10.5 [Point 3]\n4s Yee, gasket froin 24.2506 Reinforce plate (A/T) [Point 4]\nreo ap D> 4 Piiot bush MT [Point 19} |\n, ql Bolt (4) 3.8 ~ 5.1 ra ax / Pilot converter 4/T{Point 20 a\nFront oil sea DJoit strainer bolt 1.6 ~ 2.4 AR i Bs ie eNO NG Se\nOil pump Grankshatt Point 21, 27. aay a YAR ~ Vo. YE\nPiston ring ‘ a: SSR C) Ce) : \\ ‘\n(Point 13. 18] a Cy iD aa}\nPiston [Point 12. ea i = Gy \\ ws “ ) Pee\n| Snap ring ge\" ae we & MSoSer yin Flywheel (Point 2]\nPiston pin (Point 14. 16] ry SO ' We Faye) (O) S++ -\\Rear plate (MT)\nCon‘red [Point 7. 17]— ) eo We & te Bearini cap bolt 4.7 ~ 5.3 [Point 22]\nmi cones bearing..--—*T) Y d ‘\n[Point 9, 10, 11] > ot ~ C\nCon'rod cap. ° ior »S (OO Re ° ear plate (A/T)\nCon’rod nut (Oy” Q ONS VSS\nRB20E Main bearing cap oc | ‘ y\n(1) 1.4~ 1.6 (Point 23] Os IE ES - Oust cover (A/T)\n(2)2.3~3.9 CONE > eG on Oi wan bot\nRB20DE, DET Pkg ti py Gf] QAO\" pan bo ,\nee 05~07 2 2\n(1) 14-16 eee >\n(2)3.9 ~ 4.5 [Point 8] Ro yg ; Mor FI\nnce Saal Oil pan G nhs a ey\n€3 Copper washer» AY, p\nJ kg-m ()orai rks are created. The following three cases\nare possible.\n1. Initial combustion only.\n* Is fuel system working? (fuel pump, injector etc.)\n2. Engine fires incompletely.\n* Check if fuel injection quantity is too small or large.\n* Check the fuel pressure.\n* Check if water temperature enrichment is provided.\n* Check if start time enrichment is provided.\n* Check if ignition timing is normal.\n3. Engine fires completely if accelerator pedal is pressed and depressed.\n¢ Check if AAC valve operation is normal.\n[Chart]\nFUEL PRESSURE?\nIs pump operating? a Check fuel hose tension in CONSULT active test mode.\nOR\nCheck if pump operating noise can be heard for five seconds\nafter turning ON the ignition.\nIs fuel pump operating during cranking?\n(If not check fuel pump system)\nINJECTION QUANTITY?\nWater temperature Check water temperature of CONSULT data monitor mode.\nenrichment provided?| OR\nDisconnect water temperature sensor and check for any\nchange.\n* Check water temperature resistance value.\n* Check water temperature sensor output voltage.\nStart time enrichment—— Check “START” signa! ON/OFF (CONSULT data monitor\nprovided? mode).\nIDLING CONTROL?\nis idling rpm Check AAC valve operation (CONSULT active test mode).\nincreased? [check if AAC vaive is fully closed.\nCheck AAC valve circuit for disconnection or ioose connectors.\nIGNITION SYSTEM?\nIgnition timing t——— Try to advance or retard timing angle.\nnormal?\nIs ignition correct? Tr Check spark plugs for fouling.\nCheck for ignition misfiring.\n(Check using a timing light or CONSULT real-time diagnostic\nmode).\nEN - 242"},{"p":261,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E ‘DE DET: CA18i/ RB25DE ENGINE\n(3) Difficult to start ......... Hard to start when engine is cold.\n[Analysis]\nInspect the system relating to water temperature as this problem only occurs when the\nengine is cold.\n* Fuel injection enrichment from engine temperature sensor signal is not functioning when\ntemperature is low.\n* Idling speed control is not functioning.\n* Start-time enrichment is not functioning.\n* Cranking speed is too low.\n[Chart]\nENGINE TEMPERATURE CORRECTION?\nEngine temperature ~- Check using CONSULT data monitor mode.\nsensor signal? | or\nDisconnect engine temperature sensor connector and check for\nany change.\nCheck engine temperature sensor resistance value.\nCheck engine temperature sensor output voltage.\nIdling control? Check if ACC valve for operation (CONSULT active test).\n[check if ACC valve is not fully closed.\nCheck ACC valve circuit for disconnection, loose connector etc.\nSTART-TIME ENRICHMENT?\nUsing CONSULT data monitor mode check if START signal is\nprovided.\nCRANKING SPEED?\nIs battery normal?\nInspect starter, starter cables (resistance, poor contact etc.)\nEN - 243"},{"p":262,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(4) Difficult to start ......... Hard to start after engine warm up.\n[Analysis]\nThis problem may also be related to the water temperature control.\n« Check engine temperature correction is inaccurate.\n* Check if fuel pressure is correct or if air bubbles are generated in the fuel wen the\nengine is hard to start, especially when water temperature is high.\n* Check if engine cranking speed is low.\n[Chart]\nENGINE TEMPERATURE CORRECTION?\nEngine temperature-— Inspect using CONSULT data monitor.\nsensor signal? [or\nDisconnect engine temperature sensor connector and check for\nany change.\n* Check engine sensor resistance value.\n* Check engine temperature sensor output voltage.\nFUEL PRESSURE?\nincrease fuel _ ———Remove vacuum hose for pressure regulator or clamp return hose.\npressure to check\nCRANKING SPEED?\nb= == Is battery normal?\nInspect starting system.\nEN - 244"},{"p":263,"t":"TROUBLE DIAGNOSIS\nRB26DETT 8827= 25 L=7 2A-8 RB25DE ENGINE\n[Analysis]\nSpark arc is created but air-fuel ratio could be incorrect.\n* Check fuel pressure.\n¢ Check fuel injection quantity. (Is engine temperature correction accurate?)\n* Check if idling speed is controlled.\n* Check if cranking speed is too low.\n[Chart]\nFUEL PRESSURE?\nFuel pump? ~ [on CONSULT active test mode to check fuel hose tension.\nOR\nCheck if you can hear pump operation noise for five seconds after\nturning ignition switch ON.\n* Check if you can hear pump operation noise when cranking.\n* Check if fuel pressure is approx. 2,5 ~ 3 kg/cm”. (the value differs\ndepending on CA18i, RB2OSOHC and DOHC).\n\nIncrease fuel ——— Disconnect vacuum hose for pressure regulator and check for any\n\npressure tocheck — change. (orclamp return hose)\n\nFuel system for —— Inspect fuel filter.\n\nclogging\n\nENGINE TEMPERATURE CORRECTION?\nEngine Inspect with CONSULT data monitor.\ntemperature sensoy OR\nsignal? Disconnect engine temperature sensor connector and check for\nany change.\n* Check engine temperature sensor resistance value.\n« Check engine temperature sensor output voltage.\nIdling control? Check if AAC valve operation is normal (CONSULT active test).\n- Check if AAC valve is not fully closed.\nCheck AAC valve connector circuit is disconnected, loose\nconnector etc.\nIGNITION SYSTEM?\n\nIgnition misfiring Check in real-time diagnostic mode (CONSULT data monitor).\nCheck crank angle sensor output for missing pulses (CONSULT\ndata monitor mode or with oscilloscope).\n\nIs spark plug gap normal?\nCheck for any leak from high-tension cable.\n\nIs ignition timing —— Check by advancing or retarding the angle.\n\nnormal?\nCRANKING SPEED?\nIs battery normal?\nCheck charged state.\nCheck starting system.\nEN - 245"},{"p":264,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(6) Poor idling ............... Fast idling inoperative.\n[Analysis]\nThis problem may have been caused by abnormal contro! of ACC valve and air regulator\nas idling speed is controlled by these device.\nThe air-fuel ratio and ignition timing also relate to this problem.\n[Chart]\nIDLE CONTROL SYSTEM?\nAir regulator Lo ls air regulator resistance normal?\noperation \\s air regulator seized?\nAAC valve Is AAC valve operation signal shown?\nIs AAC valve operation normal (CONSULT active test mode).\nIs idle judgement ON? (CONSULT data monitor mode).\nCheck for ACC valve circuit for breaks or loose connectors.\nEngine Check using CONSULT data monitor.\ntemperature OR\nsignal? Disconnect engine temperature sensor connector and check for\nany change.\n* Check engine temperature sensor resistance value.\n* Check water temperature sensor output voltage.\nAIR-FUEL RATIO?\nEnrich mixture ——— Increase fuel pressure (Disconnect pressure regulator vacuum hose\nto check or CONSULT active test).\nLean mixture ———— Reduce the fuel pressure (CONSULT active test or apply negative\nto check pressure greater than -500 mmHg).\nEN - 246"},{"p":265,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(7) Poor idling ............... Low idle rpm \\after warm up).\n[Analysis]\nIdling speed is controlled by AAC valve. Alow rpm means insufficient auxiliary air volume\nthrough AAC valve.\n[Chart]\nIDLE CONTROL SYSTEM?\nAAC valve Is ACC valve control signal issued?\noperation? Is AAC valve operation normal? (CONSULT active test mode).\nMeasure resistance value of ACC valve and check seizure.\nCheck AAC valve circuit for disconnection or looseness.\nInput Signal? Is idle judgement ON?\nIs air conditioner switch and neutral switch turned ON? (CONSULT\ndata monitor mode).\nIS IGNITION TIMING NORMAL?\nEN - 247"},{"p":266,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(8) Poor idling ............... High idle rom (after warm up).\n[Analysis]\nHigh idling can be caused by following points below:\n* Low engine temperature signal.\n* Throttle valve switch (Idle judgement) is OFF.\n* AAC valve is seized.\n¢ Air regulator is not energized.\n* Airreguiator is seized.\n« Control unit adjustment volume is set to HIGH.\n+ Throttle valve is open.\n* Airis sucked in.\n[Chart]\nIDLE CONTROL SYSTEM\nEngine temperature p—-Check with CONSULT data monitor mode\nsignal? —| oR\nDisconnect engine temperature sensor connector and check for\nany change.\n« Check for engine temperature sensor resistance value.\n* Check for engine temperature sensor output voltage.\nThrottle sensor ——— Check idle judgement signal with CONSULT data monitor mode or\nby using tester.\nAAC valve Is AAC valve control signal present?\ncontrol Is AAC valve operation normal? (CONSULT active test mode).\nCheck AAC valve for seizure.\nDisconnect AAC valve connector and close the valve to see if\nengine rpm lowers.\nTurn off air conditioner and power steering switch OFF and see if\nON signal is disconnected.\nCheck if neutral switch is OFF or vehicle speed signal input is OK.\nAir regulator ——7— Check air regulator circuit for breaks or joose connectors.\nCheck air regulator for seizure.\nControl unit ———— Is adjustment knob set at HIGH position?\nadjustment knob\nOTHERS\nThrottle valve ———— Is valve open? (Check for wire binding).\nAir suction ————— Block blow-by hose passage and check for any change.\nEN - 248"},{"p":267,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(9) — Unstable idling ......... Cold engine only.\n[Analysis]\nSince idling is unstable only when the engine is cold, cause of this problem can be\nnarrowed down to the relationship between the engine temperature and idle control\nsystem. It also relates to the air-fuel ratio, ignition timing, misfiring etc.\n[Chart]\nIDLE CONTROL SYSTEM\nEngine temperature—Inspect using CONSULT data monitor mode.\nsensor signa! Check engine temperature resistance value.\nCheck engine temperature output voltage.\nAAC valve See if the valve is closed compietely. See if idle adjustment is\nwithin specification.\nIs AAC valve operation normal? (CONSULT active test).\nAIR-FUEL RATIO?\nMake the mixture —- Use CONSULT active test mode to make the mixture rich or lean or\nrich or lean disconnect pressure regulator vacuum hose or apply additional\nvacuum.\nIGNITION SYSTEM\nIgnition timing Advance or retard ignition timing and check for any change.\nnormal?\nIgnition misfiring Check crank angie sensor by real time diagnostic method\n(CONSULT data monitor).\nCheck spark plug condition.\nCheck ignition system condition by real time diagnostic method\n(CONSULT data monitor).\nEN - 249"},{"p":268,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(10) Unstable idling ......... After warm up.\n[Analysis]\nRelates to various factors including air-fuel ratio, ignition system and compression. It is\nnecessary to determine factors beginning with items that are easy to check.\n* Idle romcontrol system .... How is AAC valve operation?\n* Air-fuel ration ............0.... Fuel pressure?\n* Injection quantity? (Enriched?)\n* Air suction?\n* Ignition system ................. Ignition timing\n* Ignition misfiring (Missing signal pulse)\n* Engine main unit.............. Poor compression\n[Chart]\nIDLE CONTROL SYSTEM\nDisable control —— Disconnect AAC valve connector and check for any change.\nfunction\nControl circuit Check if control signal is present and check signal condition.\nIs AAC valve operation normal? (CONSULT active test).\nDisconnect AAC valve connector and check by adjusting with IAS.\nCheck AAC valve for seizure.\nCheck if idle judgment is ON (CONSULT data monitor).\nCheck circuit for breaks and connectors for looseness.\nAIR-FUEL RATIO\nEnrich the mixture —-CONSULT active test or remove pressure regulator vacuum hose.\nOR clamp return hose.\nLean the mixture —— Reduce the mixture ratio by using “FUEL INJECTION” in\nCONSULT active test mode, or applying vacuum greater than\n-500mmHg.\nStop feedback ~ [or CONSULT active test\nOR\nDisconnect engine temperature sensor connector and check for\nany change.\n* Check engine temperature sensor resistance value.\n* Check engine temperature sensor output voltage.\nAir suction —————— Check vacuum line and biow-by hose.\nIGNITION SYSTEM\nIgnition timing —-——— Advance or retard ignition timing angle and check for any change.\nnormal?\nIgnition misfiring Check ignition system by real-time diagnosis (CONSULT data\n‘i monitor mode).\nCheck condition of the crank angle sensor by rea-time diagnosis.\nCheck condition of the spark plug.\nENGINE MAIN BODY\nCompression ———— Measure compression pressure (Check valve timing, valve seats,\npressure piston rings etc.)\nEN - 250"},{"p":269,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E «DE. DET CaAt8i/ RB25DE ENGINE\n[Analysis]\nIt is necessary to first verify if the problem occurs during acceleration or during cruising.\n1. During acceleration\n* Engine breathing while accelerator pedai is depressed may be caused by\nmomentary misfiring or momentary occurrence of lean mixture (ie. no interrupt\ninjection).\n* Inclination of engine during acceleration etc. can increase tension of harness or\nair duct that can cause poor contact.\n* Clogging in fuel system is cause for engine breathing. Sufficient fue! pressure\ncannot be maintained during acceleration.\n2. During cruising\n+ Lean mixture and engine breathing caused by poor feedback of air-fuel ratio data.\n+ Misfiring of ignition system caused by leaks.\n* Poor contact or malfunction of signal system, use of low quality gasoline.\n[Chart]\n1. During acceleration\nAIR-FUEL RATIO\nStop feedback Perform CONSULT active test\n“| or\nDisconnect exhaust gas sensor.\nEnrich mixture ——— Perform CONSULT active test or disconnect engine temperature\nsensor and apply 600 Q resistance after warming up the engine.\nThrottle valve ———— Check idle judgement ON/OFF operation in CONSULT data\nswitch monitor mode.\nThrottle sensorp——— Check if output voltage varies with throttle opening.\nFuel pressure ——— Check if fuel pressure is maintained even while racing the engine.\nAirleak —————— Check air duct looseness.\nAir flow meter ——— Check output voltage.\noutput\nIGNITION SYSTEM\nIgnition misfiring Check signal system (Ignition signal, crank angle sensor signal, air\nflow meter signal) for instantaneous break by CONSULT data\nmonitor.\nCheck spark plug gap.\nCheck for any leak from high tension cable.\nCheck if ignition coil power supply voltage is lowered.\nIgnition timing ——— Check if fail-safe mode is not set due to a detonation sensor error.\nEN - 251"},{"p":270,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET ' CA18|. RB25DE ENGINE\n2. When cruising\nAIR-FUEL RATIO\nFeedback Perform CONSULT active test\nfunction OR\nDisconnect exhaust sensor connector.\nPerform exhaust gas sensor monitor diagnosis to see if exhaust\ngas warning lamp (or control unit red lamp) is flashing or check by\n| CONSULT data monitor.\nCheck if exhaust gas temperature warning lamp (or contro! unit red\nlamp) is flashing more than five times in ten seconds when engine\nis running at 2,000 rpm, or check by CONSULT data monitor.\nThrottle valve ——— Check idling contact point revolution.\nswitch\nIGNITION SYSTEM\nIgnition misfiring —— Check for instantaneous break signal system using real-time\ndiagnosis (ignition signal, crank angle sensor signal, air flow meter\nsignal) (Use CONSULT data monitor or oscilloscope).\n(12) Poor drivability ......... Knocking.\n[Analysis]\nThis problem may be caused by lean air-fuel mixture, incorrect ignition timing or\nmalfunctioning or engine main unit or cooling system.\n« Lean mixture ratio may be caused by fuel enrichment correction not working during\nacceleration, incorrect air flow meter output, incorrect air-fuel ratio feedback correction.\n¢ Errors in initial ignition timing or knock control system relate to the detonation caused by\nincorrect ignition timing.\n* Other causes can be excessively high cooling engine temperature, increased\ncompression ratio due to carbon deposits in combustion chamber etc.\n[Chart]\nAIR-FUEL RATIO?\nFuel pressure? ——— Check if fuel pressure remains normal when racing.\nEnrich mixture Enrich air-fuel ratio (CONSULT active test or disconnect pressure\n| regulator vacuum hose).\nDisconnect engine temperature sensor and check for any change.\nStop feedback [oR by CONSULT active test mode\nOR\nDisconnect exhaust gas sensor connector and check for change.\nIf any change is noted, check the fuel system (fuel pump, sensor\nsystem or clogging in the system).\nInjector clogging —— Clean with engine conditioner.\nIdle judgement —— |s throttle sensor OFF when accelerating?\nIGNITION TIMING?\nL—_____ jg ignition timing normal?\nKnock control ——— Check if detonation sensor error is indicated by self-diagnosis.\nCheck harness for disconnection or shorts-circuit.\nEN - 252"},{"p":271,"t":"TROUBLE DIAGNOSIS\nRB26DETT : RB20E. DE. SET CA18i / RB25DE ENGINE\n[Analysis]\nLack of power, poor acceleration and poor responses are generally caused by insufficient\nmixture quantity (lack of fuel, lack of air) or incorrect air-fuel mixture ratio.\nin the injection system, these problems are caused by lack of ignition energy or incorrect\nignition timing.\nLack of compression pressure and excessive friction due to seizure in engine main body\nare also causes of these conditions.\n{Chart]\nMIXTURE AIR QUANTITY, AIR-FUEL RATIO\nFuel pressure ——— Check if fuel pressure drops during racing (check for clogging\nwith fuel pump and fuel system).\nEnrich mixture ——— Enrich by CONSULT active test or disconnect pressure regulator\nvacuum hose.\nStop feedback ——— Check for change by CONSULT active test or disconnect exhaust\nsensor connector.\nInjector clogging —— Clean with engine conditioner (CONSULT active test or pour\nconditioner into fuel filter, start engine then race engine).\nAir flow meter ——— Check output voltage.\noutput\nIGNITION SYSTEM\nSpark plug? ———— Is plug gap normal?\nIgnition timing Is ignition timing normal?\ncheck by advancing or retarding ignition timing angle.\nCheck detonation sensor for abnormality (self-diagnosis for\nharness disconnection and shorts).\nIgnition energy? L Check ignition coil power voltage.\nCheck for any leak from high-tension cable.\nENGINE MAIN BODY\nCompression ——— Measure compression pressure (Also check vaive timing, valve\npressure? seat contact, piston and rings).\nEN - 253"},{"p":272,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(14) Engine stall when start driving.\n[Analysis]\nEngine stall is caused by misfiring when accelerator pedal is pressed or insufficient torque\nwhen starting off.\n* Misfiring\n* Too lean or too rich air-fuel mixture ratio.\n« Large error in ignition timing.\n« Weak spark.\n* Insufficient torque\n« Lean or rich mixture.\n« Insufficient intake air quantity.\n* Insufficient compression pressure.\n[Chart]\nSELF-DIAGNOSIS\n|_______ Check if occurrence of error is stored by self-diagnosis function.\nAIR-FUEL RATIO\nEnrich mixture ——— CONSULT active test or disconnect pressure regulator vacuum\nhose.\nLean mixture ————- CONSULT active test or apply vacuum greater than -500mmHg\nwith vacuum hand pump to pressure regulator.\nStop eee Ton CONSULT active test\nOR\nDisconnect exhaust sensor connector (race engine and return to\nidle).\nCheck canister ——— Check by blocking purge line.\nThrottle valve ———— Check if idle judgement is OFF when accelerator is ON (check by\nswitch CONSULT data monitor).\n———— Check engine temperature sensor.\nThrottle sensor ——— Check if accelerator opening signal is output.\nIGNITION\nSpark -——————— Check spark plug condition (fouling, gap, electrodes).\nIgnition timing ——— Check if ignition timing is correct.\nIgnition error ———— Check by real-time diagnosis (Perform CONSULT data monitor)\nHigh-tension ———— Check resistance value and any leak.\ncable\nINTAKE AIR QUANTITY\nLo Check if throttle valve opens normally.\nCheck for any leak from turbocharger system. Duct inspection.\nCOMPRESSION PRESSURE\nMeasure —————— Check valve timing, valves for incorrect timing, piston, ring for\ncompression damage.\nEN - 254"},{"p":273,"t":"TROUBLE DIAGNOSIS\nRB26DETT/RB20E DE DET CA18i/ RB25DE ENGINE\n[Analysis]\nEngine stall during idling may be caused by one of the following conditions. (check idling\nspeed, and then check for misfiring).\n* Improper idling speed.\n* Improper AAC valve control (Check for delayed response).\n* Excessively lean or rich mixture ratio.\n*« Ignition error.\n« Poor connector contacts etc.\n* Relation to electrical load ON-OFF.\n[Chart]\nSELF-DIAGNOSIS\n|______ Check if occurrence of error is stored by self-diagnosis function.\nIDLING CONTROL\nProper control Is idling speed normal or adjusted?\nIs AAC valve fuily closed? (Check for loose connector).\nClose AAC vaive fully and check for any change.\nIs AAC valve control signal issued?\n(Race engine and check voltage).\nls AAC valve operation normal? (CONSULT active test).\nDisconnect AAC valve connector and check by adjusting IAS.\nSee if idle judgement is ON.\nAIR-FUEL RATIO\nAir-fuel ratio ———— Check if exhaust gas temperature warning lamp (control unit red\nnormal? lamp) will flash more than five times in ten seconds when engine is\nrunning at 2,000 rpm, or check by CONSULT data monitor.\nEnrich mixture ——— Perform CONSULT active test or disconnect pressure regulator\nvacuum hose.\nLean mixture ————Perform CONSULT active test or apply vacuum greater than\n-500mmHg with hand pump to pressure regulator.\nStop feedback To CONSULT active test\nOR\nDisconnect exhaust gas sensor (Set circuit from racing mode one\ntime and return to idling mode).\nFuel pump ————— Check for pump stop.\nFuel system t———— Race engine and check fuel pressure for drop.\nclogging\nOTHER\nPoor contact ———— Using real-time diagnosis moda, check ignition signal, crank angle\nsensor signal and air flow meter signal for instantaneous break and\nmissing pulses. (Use CONSULT data mode or oscilloscope).\nSpark plug Check for fouling and plug gap.\nEN - 255"},{"p":274,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18// RB25DE ENGINE\n(16) Engine stall while driving.\n[Analysis]\nEngine stall during cruising may be caused by misfiring. If engine stalls during accelera-\ntion, it may be caused by misfiring or insufficient torque.\n* Too rich or lean air-fuel mixture.\n* Ignition error.\n* Incorrect ignition timing.\n* Insufficient intake air quantity.\n* Insufficient compression pressure.\n* Misfiring, fuel pump stop, etc. caused by poor electrical contact.\n[Chart]\nSELF-DIAGNOSIS\n|________ Check if occurrence of error is stored by self-diagnosis function.\n(1) When cruising\nAIR-FUEL RATIO\nThrottle valve t——— Check if idle judgement goes OFF at correct time.\nswitch\nFeedback —————— Check if exhaust gas temperature lamp (control unit red lamp) will\nflash more than five times in ten seconds when engine is running at\n2,000 rom, or check by CONSULT data monitor.\nStop feedback TL Pertorm CONSULT active test. OR\nDisconnect exhaust gas sensor connector.\nIntake air quantity —— Check for poor contact by CONSULT data monitor (real-time\nsignal diagnosis).\nIGNITION\nIgnition timing ——— |s ignition timing correct?\nIgnition misfiring —— Check ignition signal, crank angle sensor signal for missing pulses\nin CONSULT data monitor.\n(2) During acceleration\nAIR-FUEL RATIO\nThrottle valve switch — Check if idle judgement goes ON-OFF when acceleration pedal is\npressed and released (CONSULT data monitor).\nThrottle sensor ——— Check if voltage output varies with throttle opening.\nFeedback —————Check if exhaust gas temperature lamp (control unit red lamp) will\nflash more than five times in ten seconds when engine is running at\n2,000 rpm, or check by CONSULT data monitor.\nStop feedback —T_ Perform CONSULT active test. OR\nDisconnect exhaust gas sensor connector.\nIntake air TL Check for poor contact by CONSULT data monitor.\nquantity Check for air flow or leak after turbocharger operation.\nMISFIRING\nIgnition timing ———— Is ignition normal?\nIgnition misfiring —— Check ignition signal and crank angle sensor signal for missing\npulses in CONSULT data monitor.\nEN - 256"},{"p":275,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E. DE. DET CA18i/ RB25DE ENGINE\n(17) Engine stall when decelerating or immediately after stopping.\n[Analysis]\nReduced engine rpm when releasing accelerator pedal can lead to engine stall. Another\ncause is misfiring.\n« Incorrect adjustment of idling control.\n* Incorrect air-fuel ratio.\n* Ignition error.\n[Chart]\nIDLE CONTROL\nIdling speed ———— Is idling speed normal? Is idle adjustment correct?\nControl Check if AAC valve control signal is output.\nCheck if AAC valve operation is normal (CONSULT active test).\nCheck if AAC valve is OK.\nCheck if idle judgement is ON.\nCheck by disconnecting AAC valve connector (AAC fully closed).\nAIR-FUEL RATIO\nStop mT Perform CONSULT active test.\nOR\nDisconnect exhaust gas sensor connector.\nFeedback —————— Check if exhaust gas temperature lamp (control unit red lamp) will\nflash more than five times in ten seconds when engine is running at\n2,000 rpm, or check by CONSULT data monitor.\nEnrich mixture ——— CONSULT active test or disconnect regulator vacuum hose.\nLean mixture ———— CONSULT active test or apply vacuum greater than -SOOmmHg\nwith hand vacuum pump to pressure regulator.\nIGNITION\nIgnition misfiring —— Check ignition signal, crank angle sensor signal for missing pulses\nin CONSULT data monitor.\nENGINE . A/T FUSION CONTROL\nControl ——————— Carry out self-diagnosis.\nEN - 257"},{"p":276,"t":"TROUBLE DIAGNOSIS\nRB26DETT / RB20E / DE / DET / CA18i/ RB25DE ENGINE\n(18) Engine stall when electrical load or power steering load is applied.\nSe eS\n[Analysis]\nCheck if idling is increased when load switch is turned ON (AAC valve correction quantity\nincreases when load is applied).\n* Check if ON signal is input from each switch.\n* Check if AAC valve is operating.\n[Chart]\nIDLE CONTROL\nIdling speed —_TSs idling speed normal? Is idle adjustment correct?\nCheck if AAC valve is fully closed.\nControl Check if AAC valve control signal is output connector firmly to disconnect without applying force to harness.\n* Do not use a screwdriver or similar tool to loosen the connector lock.\n2. Connector installation\n* Turn ignition switch OFF.\n* Make sure pins are not bent or control unit connector and then connect securely.\n* Tighten bolts securely until injector surface reaches orange colour indicator of\nconnector and surface is even.\n\n(3) Control unit power\n\n* Never make a reverse connection to the battery.\n\n¢ Use battery voitage in 10 - 16V range.\n\n(4) Idle speed adjustment knob\n\n¢ Do not turn past lock position.\n\n* Do not turn adjustment knob when ambient temperature lower than 0°.\n\n(5) Water and oil\n\n« Care must be taken not to allow rain drops or water to wet the control unit.\n\n* Care must be taken that condensation does not form due to sudden increase in\ntemperature. If there is any moisture, dry control unit adequately before installing in the\nvehicle.\n\n« Make sure no oil adheres to connectors.\n\n+ Do notclean the control unit using volatile solvent cleaners.\n\n(6) Dropping and impact\n\n* Donot drop the controi unit or subject it to strong impact.\n\n¢ Do not use upper and lower covers for the control unit which are dented.\n\n(7) Control unit screws and cover\n\n« Do not remove the upper and lower covers from the control unit.\n\n+ Do not turn the screws in the contro/ unit main body.\n\nEN - 498"},{"p":517,"t":"ECCS C/U INPUT/OUTPUT SIGNALS\nRB20E / DE / DET ENGINE\n9-1 CONSULT INSPECTION VALUES\n(1) Data monitor\nNote: The output signal is displayed as the calculation data on console unit so the correct\nvalue will displayed even if the output circuit (harness) is inadvertently disconnected.\nRB20E / DE / DET ENGINE\npea DRT MONITOR cs\n‘MONITORING TEMS a “~ - - - PROBLEM INSPECTION\ntte eae 4 pS oe . sooo P NORMAL REFERENCE : {TEM\ncarn Bike MR Sopp dae es SONDEITION OS pore : ‘ape’ H\n2JE ge 2 ES AE Ge SPURS og Se El eo MALUB ce |\nCAS_RPM (Detected angle Tachometer set T nstalling in the\nvehicle.\n\n* Make sure no oil adheres to connectors.\n\n¢ Donot clean the control unit using volatile solvent cleaners.\n\n(6) Dropping and impact\n\n+ Do not drop the control unit or subject it to strong impact.\n\n* Do not use upper and lower covers for the contro! unit which are dented.\n\n(7) Control unit screws and cover\n\n* Donot remove the upper and lower covers from the control unit.\n\n« Do not turn the screws in the control unit main body.\n\nEN - 512"},{"p":531,"t":"ECCS C/U INPUT/OUTPUT SIGNALS\nCA18i ENGINE\n9-1 CONSULT INSPECTION VALUES\n(1) Data monitor\nNote: The output signal is displayed as the calculation data on console unit so the correct\nvalue will displayed even if the output circuit (harness) is inadvertently disconnected.\nCA18i ENGINE\nPoe eee | ee ee DATAMONITOR: = 0 9\n“MONITORING ITEMS Te EEE | PROBLEM INSPECTION\n_ MONITORING ITEMS [00 Ee NORMAL REFERENCE | ITEM 2-2\nere bu Be BOB Ue SE pe coe AE DO A MAIR i ep OSGi nay\nCAS.RPM (Detected angle Tachometer set There must be no abnormal |. k angk tl\nspeed according to signals) Engine running change in speed Uranik angle sensor system\nENG TEMP SEN Engine temperature sensor\n(engine temperature) After warming up engine Above approx. 70°C system\nEXT GAS SEN Changes between 0 ~ 0.3V and/Exhaust gas sensor system\n(output voltage) After warming 06 ~1V Intake system air leak or air\n2000rpm with no load\nEXT GAS SEN up engine \"p RICH. LEAN repeats 5 times or |intake\n(RICH / LEAN) more in 10 seconds injector system\nCAR SPEED SEN While driving or with drive wheels Should generally conform to Vehicle speed sensor system\n(vehicle speed signal) turing speedmeter display\nBattery\nEngine stopped\nsystem\nwaomesen J\ntout It ignition sw\ncoupes volsge) ON Thottle sensor adjusiment\nEngine Throttle sensor system\nTHROTTLE SEN (2) siorped — |_Mroltle fuly closed [os *\n(output voltage) Throte fly open\nINTIA TEMP SEN Intake air temperature is Intaktemperature sensor\n(intakte eee 19\npower supply & ground CHCUIR ....seeeessssasee EN “tes Valve clearance inSpection .......c cee EN - 45\nCoa ar guise EN. oes Vehicle identification plate location ............... Gl - 10\nSeen reneeenaneneees 7 Vehicle speed s' Litiatisieiee: EN - 397, 430\nPTC heater control system... EN - 352 P ensor\nPurge control VaIVE ......c ccc EN-54 W\nWastegate valve control .............0::ee EN - 350\nWater bypass Connector ............: eerie EN - 67\nWater outlet elDOW ...... eee EN - 67\nWater pump ......... eres EN - 96, 126, 147\nEN - 563"}],"count":580}}</script>
<script>
const MANUALS = JSON.parse(document.getElementById('mdata').textContent);
const keys = Object.keys(MANUALS);
let current = keys[0];
let scope = 'this';
let sortMode = 'rel';

const $ = id => document.getElementById(id);
const totalPages = keys.reduce((n,k)=>n+MANUALS[k].pages.length,0);
$('pageCount').textContent = MANUALS[current].count || MANUALS[current].pages.length;

// manual selector
const sel = $('manual');
keys.forEach(k=>{
  const o=document.createElement('option');
  o.value=k; o.textContent=MANUALS[k].code+' \u00b7 '+MANUALS[k].name.replace(/^.*\u2014\s*/,'');
  sel.appendChild(o);
});
sel.value=current;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function reFromTerms(terms){return new RegExp(terms.map(escRe).join('|'),'gi');}

function parseTerms(q){
  const terms=[]; const re=/"([^"]+)"|(\S+)/g; let m;
  while((m=re.exec(q))){const t=(m[1]||m[2]||'').toLowerCase().trim(); if(t) terms.push(t);}
  return terms;
}
function countMatches(text,re){re.lastIndex=0;let n=0,g=0,m;while((m=re.exec(text))&&g<8000){g++;n++;if(m[0]==='')re.lastIndex++;}return n;}

function highlight(seg,terms){
  const re=reFromTerms(terms); re.lastIndex=0;
  let out='',last=0,m,g=0;
  while((m=re.exec(seg))&&g<2000){g++;
    if(m[0]===''){re.lastIndex++;continue;}
    out+=esc(seg.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';
    last=m.index+m[0].length;
  }
  return out+esc(seg.slice(last));
}

function snippets(text,terms){
  const re=reFromTerms(terms); re.lastIndex=0;
  const spans=[]; let m,g=0;
  while((m=re.exec(text))&&g<600){g++; const s=m.index,e=s+m[0].length; spans.push([s,e]); if(e===s)re.lastIndex++;}
  const CTX=95, wins=[];
  for(const [s,e] of spans){
    let ws=Math.max(0,s-CTX), we=Math.min(text.length,e+CTX);
    if(wins.length && ws<=wins[wins.length-1].we+30){wins[wins.length-1].we=Math.max(wins[wins.length-1].we,we); continue;}
    wins.push({ws,we}); if(wins.length>=3) break;
  }
  return wins.map(w=>{
    let s=w.ws,e=w.we,seg=text.slice(s,e);
    const pre=s>0,post=e<text.length;
    if(pre){const i=seg.indexOf(' ');if(i>-1&&i<26)seg=seg.slice(i+1);}
    if(post){const i=seg.lastIndexOf(' ');if(i>seg.length-26&&i>0)seg=seg.slice(0,i);}
    seg=seg.replace(/\s*\n\s*/g,' ').trim();
    return (pre?'\u2026 ':'')+highlight(seg,terms)+(post?' \u2026':'');
  });
}

function pageTitle(t){
  for(const ln of t.split('\n')){const s=ln.trim(); if(s.length>=8 && /[A-Za-z]/.test(s)) return s.slice(0,80);}
  return '';
}

function search(){
  const q=$('q').value.trim();
  $('field').classList.toggle('has-val', q.length>0);
  if(!q){renderEmpty(); $('count').textContent='Ready'; return;}
  const terms=parseTerms(q);
  if(!terms.length){renderEmpty(); return;}
  const re=reFromTerms(terms);
  const inManuals = scope==='all' ? keys : [current];
  let rows=[];
  for(const k of inManuals){
    const man=MANUALS[k];
    for(const pg of man.pages){
      const lt=pg.t.toLowerCase();
      let ok=true; for(const t of terms){if(lt.indexOf(t)===-1){ok=false;break;}}
      if(!ok) continue;
      rows.push({k, p:pg.p, t:pg.t, cnt:countMatches(pg.t,re)});
    }
  }
  if(sortMode==='rel') rows.sort((a,b)=> b.cnt-a.cnt || a.p-b.p);
  else rows.sort((a,b)=> (a.k===b.k?0:(a.k<b.k?-1:1)) || a.p-b.p);
  render(rows,terms,q);
}

function render(rows,terms,q){
  const res=$('results');
  const totMatch=rows.reduce((n,r)=>n+r.cnt,0);
  const showAll = scope==='all' && keys.length>1;
  if(!rows.length){
    res.innerHTML='<div class="empty"><h2>No matches for \u201c'+esc(q)+'\u201d</h2><p>Try fewer or different words. Search matches raw scanned text, so part codes and abbreviations often work better than full phrases. Multiple words must all appear on the same page.</p></div>';
    $('count').textContent='0 pages';
    return;
  }
  const cap=500, shown=rows.slice(0,cap);
  let html='';
  for(const r of shown){
    const man=MANUALS[r.k];
    const title=pageTitle(r.t);
    const snips=snippets(r.t,terms).map(s=>'<p>'+s+'</p>').join('');
    const sect=(showAll?('<span style="color:var(--accent-2)">'+esc(man.code)+'</span> &nbsp; '):'')+(title?esc(title):'');
    html+='<div class="row">'
      +'<div class="marker"><div class="plab">p.</div><div class="pno">'+r.p+'</div><div class="hits">'+r.cnt+(r.cnt===1?' hit':' hits')+'</div></div>'
      +'<div class="body">'
        +(sect?'<div class="sect">'+sect+'</div>':'')
        +'<div class="snip">'+snips+'</div>'
        +'<button class="viewbtn" data-k="'+r.k+'" data-p="'+r.p+'">View full page &#9656;</button>'
      +'</div></div>';
  }
  res.innerHTML=html;
  const capNote = rows.length>cap ? ' &middot; showing first '+cap : '';
  $('count').innerHTML='<b>'+rows.length+'</b> '+(rows.length===1?'page':'pages')+' &middot; '+totMatch+' matches'+capNote;
}

function renderEmpty(){
  const ex=[['timing belt','40'],['RB26DETT','226'],['idle speed','83'],['oil pump','49'],['spark plug','59'],['crankshaft','23'],['turbocharger','26'],['coolant','13']];
  let chips=ex.map(e=>'<button class="chip" data-q="'+e[0]+'">'+e[0]+'<span class="m">'+e[1]+'</span></button>').join('');
  $('results').innerHTML='<div class="empty">'
    +'<h2>Search '+totalPages+' pages of the R32 engine manual</h2>'
    +'<p>Type any part, system, spec, or engine code. Every match shows the page number and the surrounding text \u2014 no PDF needed.</p>'
    +'<div class="chips">'+chips+'</div>'
    +'<div class="tip">Press <kbd>/</kbd> to jump to search &middot; use "quotes" for an exact phrase</div>'
    +'</div>';
}

// events
let deb;
$('q').addEventListener('input',()=>{clearTimeout(deb); deb=setTimeout(search,110);});
$('clear').addEventListener('click',()=>{$('q').value=''; $('q').focus(); search();});
$('manual').addEventListener('change',e=>{current=e.target.value; $('pageCount').textContent=MANUALS[current].pages.length; search();});
$('scopeThis').addEventListener('click',()=>setScope('this'));
$('scopeAll').addEventListener('click',()=>setScope('all'));
function setScope(s){scope=s; $('scopeThis').setAttribute('aria-pressed', s==='this'); $('scopeAll').setAttribute('aria-pressed', s==='all'); search();}
$('sort').addEventListener('change',e=>{sortMode=e.target.value==='page'?'page':'rel'; search();});

$('results').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){$('q').value=chip.dataset.q; search(); $('q').focus(); return;}
  const vb=e.target.closest('.viewbtn');
  if(vb){
    const body=vb.parentElement;
    const existing=body.querySelector('.full');
    if(existing){existing.remove(); vb.innerHTML='View full page &#9656;'; return;}
    const man=MANUALS[vb.dataset.k];
    const pg=man.pages.find(x=>x.p==vb.dataset.p);
    const terms=parseTerms($('q').value);
    const div=document.createElement('div');
    div.className='full';
    div.innerHTML=highlight(pg.t, terms.length?terms:['\u0000nomatch']);
    body.appendChild(div);
    vb.innerHTML='Hide full page &#9662;';
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==$('q')){e.preventDefault(); $('q').focus();}
  else if(e.key==='Escape' && document.activeElement===$('q')){$('q').value=''; search(); $('q').blur();}
});

renderEmpty();
</script>
